[package]
name = "kiln-desktop"
version = "0.1.0"
description = "The cross-platform desktop shell for Kiln"
authors = ["Kiln contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kiln_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kiln-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
