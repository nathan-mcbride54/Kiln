[package]
name = "kiln-tauri"
version = "0.1.0"
description = "The thin Tauri transport and application shell for Kiln"
authors = ["Kiln contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kiln_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kiln-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kiln-core = { path = "../../crates/kiln-core" }
kiln-platform = { path = "../../crates/kiln-platform" }
kiln-providers = { path = "../../crates/kiln-providers" }
kiln-storage = { path = "../../crates/kiln-storage" }
kiln-workspace = { path = "../../crates/kiln-workspace" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio.workspace = true
