[workspace]
members = [
  "crates/kiln-core",
  "crates/kiln-orchestrator",
  "crates/kiln-platform",
  "crates/kiln-providers",
  "crates/kiln-storage",
  "crates/kiln-workspace",
  "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
dunce = "1"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
url = "2"
zeroize = "=1.8.2"
